<script>
document.addEventListener('DOMContentLoaded', function () {
  // Trainer Beanspruchung (aus /kit11/beanspruchung/)
  var NAME = ['Zug', 'Druck', 'Biegung', 'Abscherung', 'Torsion'];
  var WORAN = ['Kräfte wirken längs und ziehen nach außen', 'Kräfte wirken längs und drücken nach innen',
    'Kraft wirkt quer, mit Abstand zur Halterung', 'zwei Kräfte wirken quer, dicht nebeneinander', 'die Enden werden gegeneinander gedreht'];
  var TEILE = [
    ['ein Kletterseil, an dem eine Person hängt', 0], ['eine gespannte Gitarrensaite', 0], ['die Kette eines Fahrrads beim Treten', 0],
    ['ein Tischbein unter einer schweren Tischplatte', 1], ['eine Säule unter einer Brücke', 1], ['ein Wagenheber, der ein Auto anhebt', 1],
    ['ein Regalbrett mit Büchern in der Mitte', 2], ['eine Angelrute, an deren Spitze ein Fisch zieht', 2], ['ein Balkon, der nur an der Hauswand befestigt ist', 2],
    ['ein Blatt Papier zwischen den Klingen einer Schere', 3], ['ein Niet, der zwei gegeneinander gezogene Bleche verbindet', 3],
    ['ein Schlüssel im Schloss beim Aufsperren', 4], ['ein Handtuch beim Auswringen', 4], ['die Antriebswelle eines Elektromotors', 4]];
  var AUSSAGEN = [
    ['„Eine Tür, die sich in den Angeln dreht, wird auf Torsion beansprucht.“', false, 'Die Tür bewegt sich nur, sie wird nicht in sich verdreht. Bewegung ist keine Verformung.'],
    ['„Ein Bohrer wird beim Bohren auf Druck und Torsion beansprucht.“', true, 'Er wird ins Werkstück gedrückt und zugleich verdreht — mehrfache Beanspruchung.'],
    ['„Ein Seil kann eine Last auch von unten stützen.“', false, 'Ein Seil ist biegeweich: Es nimmt nur Zug auf. Unter Druck weicht es seitlich aus.'],
    ['„Ein Regalbrett mit Büchern wird oben gestaucht und unten gedehnt.“', true, 'Es biegt sich nach unten durch: Die Oberseite wird kürzer, die Unterseite länger.'],
    ['„Eine Schraube wird beim Anziehen nur auf Torsion beansprucht.“', false, 'Beim Anziehen wird sie verdreht und zugleich gelängt: Torsion und Zug.'],
    ['„Wer an der Spitze einer Angelrute zieht, beansprucht sie vor allem auf Zug.“', false, 'Die Kraft greift quer zur Rute an, mit großem Abstand zum Griff: Biegung.'],
    ['„Beton hält viel Druck, aber wenig Zug — deshalb liegt in Betonbalken unten Stahl.“', true, 'Ein belasteter Balken wird unten gedehnt (Zug). Dort hilft der Stahl.'],
    ['„Je größer die Kraft, desto eher wird aus Zug eine Biegung.“', false, 'Die Art hängt von Richtung und Lage der Kraft ab, nicht von ihrer Größe.']];
  function wahlFeld(label, ans) {
    return { typ: 'wahl', label: label, optionen: NAME, ans: ans,
      warum: NAME.map(function (n, j) { return j === ans ? '' : 'Schauen Sie auf die Richtung der Kräfte: ' + WORAN[ans] + '.'; }) };
  }
  Aha.Trainer({ el: 'trainer', stufen: ['Zuordnen', 'Bestimmen', 'Beurteilen'], neu: function (stufe) {
    if (stufe < 3) {
      var T = Aha.eins(TEILE), a = T[1];
      var weg = '<p><b>' + NAME[a] + '</b>: ' + WORAN[a] + '.</p>';
      if (stufe === 1) return { operator: 'Ordnen Sie zu', frage: 'Wie wird ' + T[0] + ' beansprucht?',
        felder: [wahlFeld('', a)], tipp: 'Stellen Sie sich das Bauteil aus Gummi vor: länger, kürzer, krumm, verschoben oder verdreht?', weg: weg };
      return { operator: 'Bestimmen Sie', frage: 'Bestimmen Sie die Beanspruchung von ' + T[0].replace(/^ein /, 'einem ').replace(/^eine /, 'einer ').replace(/^die /, 'der ').replace(/^das /, 'dem ') + ' — und woran Sie sie erkennen.',
        felder: [wahlFeld('Beanspruchung:', a), { typ: 'wahl', label: 'Woran erkannt?', optionen: WORAN, ans: a,
          warum: WORAN.map(function (w, j) { return j === a ? '' : 'Passt die Richtung der Kräfte zu diesem Bauteil?'; }) }],
        tipp: 'Zeichnen Sie in Gedanken die Kraftpfeile ein: längs oder quer? Mit Abstand oder dicht nebeneinander?', weg: weg };
    }
    var S = Aha.eins(AUSSAGEN);
    return { operator: 'Beurteilen Sie', frage: 'Stimmt die Aussage? ' + S[0],
      felder: [{ typ: 'wahl', optionen: ['stimmt', 'stimmt nicht'], ans: S[1] ? 0 : 1, warum: ['', ''].map(function () { return S[2]; }) }],
      tipp: 'Fragen Sie: Wie verformt sich das Bauteil <b>in sich</b>? Bewegung allein zählt nicht.', weg: '<p>' + (S[1] ? 'Stimmt. ' : 'Stimmt nicht. ') + S[2] + '</p>' };
  } });
});
</script>
