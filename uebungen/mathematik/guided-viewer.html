<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geführter Lernpfad – Mathematik</title>
<link rel="stylesheet" href="../../static/fonts.css">
<link rel="stylesheet" href="../../static/theme.css">
<style>
:root {
  --ink:#1a1208; --paper:#f7f3ec; --cream:#ede8de;
  --accent:#c8400a; --gold:#c9961a; --line:#d4cfc6;
  --mono:'DM Mono',monospace; --serif:'Playfair Display',Georgia,serif; --sans:'Source Sans 3',sans-serif;
  --nav-h: 54px;
}
*{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none!important;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);height:100vh;overflow:hidden;}

/* ── Fixed top nav ── */
.guided-nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;
  background:var(--ink);display:flex;align-items:stretch;
  border-bottom:2px solid rgba(255,255,255,.07);
}
[data-theme=dark] .guided-nav{background:var(--cream);}

.nav-btn{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:none;color:rgba(255,255,255,.65);cursor:pointer;
  padding:0 1.1rem;transition:all .15s;white-space:nowrap;
  display:flex;align-items:center;gap:.4rem;
}
.nav-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.07);}
.nav-btn:disabled{opacity:.25;cursor:default;}
.nav-btn.nav-exit{color:rgba(255,255,255,.4);}
.nav-btn.nav-exit:hover{color:rgba(255,255,255,.7);}
.nav-btn.nav-next.nav-finish{color:var(--gold);}

.nav-center{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 .5rem;overflow:hidden;min-width:0;
}
.nav-step{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-label{
  font-family:var(--serif);font-size:.95rem;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
[data-theme=dark] .nav-label, [data-theme=dark] .nav-step{color:rgba(232,228,223,.9);}
[data-theme=dark] .nav-btn{color:rgba(232,228,223,.6);}
[data-theme=dark] .nav-btn:hover:not(:disabled){color:#e8e4df;background:rgba(255,255,255,.08);}
[data-theme=dark] .nav-btn.nav-exit{color:rgba(232,228,223,.3);}

/* Progress bar (thin strip at very bottom of nav) */
.nav-progress-wrap{
  position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.1);
}
.nav-progress-fill{height:100%;background:var(--gold);transition:width .3s ease;}

/* ── FAP filter hint bar ── */
.fap-hint{
  position:fixed;top:var(--nav-h);left:0;right:0;z-index:90;
  background:#2a6496;color:#fff;
  font-family:var(--mono);font-size:.73rem;letter-spacing:.05em;
  padding:.4rem 1.2rem;display:flex;align-items:center;gap:.8rem;
}
.fap-hint-close{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:.9rem;margin-left:auto;}
.fap-hint-close:hover{color:#fff;}

/* ── Exercise iframe ── */
#exercise-frame{
  position:fixed;left:0;right:0;bottom:0;border:none;width:100%;
  /* top set dynamically by JS */
}

/* Error state */
.guided-error{
  position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  background:var(--paper);
}
.guided-error p{font-size:1rem;color:#888;}
.guided-error a{font-family:var(--mono);font-size:.8rem;color:var(--accent);text-decoration:none;}
</style>
<script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<!-- Top nav -->
<nav class="guided-nav" aria-label="Lernpfad-Navigation">
  <button class="nav-btn nav-prev" id="nav-prev" aria-label="Vorherige Übung">← Vorige</button>

  <div class="nav-center">
    <div class="nav-step" id="nav-step"></div>
    <div class="nav-label" id="nav-label"></div>
  </div>

  <button class="nav-btn nav-next" id="nav-next" aria-label="Nächste Übung">Weiter →</button>
  <button class="nav-btn nav-exit" id="nav-exit" aria-label="Lernpfad beenden" title="Zur Themenübersicht">✕</button>

  <div class="nav-progress-wrap" aria-hidden="true">
    <div class="nav-progress-fill" id="nav-progress"></div>
  </div>
</nav>

<!-- FAP filter hint (shown only for FAP nodes) -->
<div class="fap-hint" id="fap-hint" hidden role="note">
  <span>&#9660; FAP-Browser: </span>
  <strong id="fap-hint-text"></strong>
  <button class="fap-hint-close" id="fap-hint-close" aria-label="Hinweis schließen">✕</button>
</div>

<!-- Exercise iframe -->
<iframe id="exercise-frame" title="Übungsaufgabe" src="about:blank"></iframe>

<!-- Error state (shown if node not found) -->
<div class="guided-error" id="guided-error" hidden>
  <p>Übung konnte nicht geladen werden.</p>
  <a href="index.html">← Zurück zur Themenübersicht</a>
</div>

<script src="topics.js"></script>
<script>
(function () {
  var T = window.MATHE_TOPICS;

  // ── Build node map ───────────────────────────────────────────────
  var nodeMap = {};
  function collectNodes(node) {
    nodeMap[node.id] = node;
    if (node.children) node.children.forEach(collectNodes);
  }
  collectNodes(T.tree);

  // ── Parse URL params ─────────────────────────────────────────────
  var params  = new URLSearchParams(location.search);
  var level   = params.get('level') || '';
  var rawIdx  = parseInt(params.get('idx') || '0', 10);

  // Resolve path (skip coming-soon nodes)
  var rawPath = (T.paths[level] || []);
  var path    = rawPath.filter(function (id) {
    var n = nodeMap[id];
    return n && n.status === 'available';
  });

  var total = path.length;
  var idx   = Math.min(Math.max(rawIdx, 0), total - 1);
  var node  = total > 0 ? nodeMap[path[idx]] : null;

  // ── Error fallback ───────────────────────────────────────────────
  if (!node) {
    document.getElementById('exercise-frame').hidden = true;
    document.getElementById('guided-error').hidden = false;
    document.getElementById('exercise-frame').style.top = '54px';
    document.querySelector('.guided-nav').style.display = 'none';
    return;
  }

  // ── Persist state ────────────────────────────────────────────────
  localStorage.setItem('mathe_path', JSON.stringify({ level: level, idx: idx }));

  // ── DOM refs ─────────────────────────────────────────────────────
  var stepEl    = document.getElementById('nav-step');
  var labelEl   = document.getElementById('nav-label');
  var prevBtn   = document.getElementById('nav-prev');
  var nextBtn   = document.getElementById('nav-next');
  var exitBtn   = document.getElementById('nav-exit');
  var progFill  = document.getElementById('nav-progress');
  var fapHint   = document.getElementById('fap-hint');
  var fapText   = document.getElementById('fap-hint-text');
  var hintClose = document.getElementById('fap-hint-close');
  var frame     = document.getElementById('exercise-frame');

  // ── Level label ──────────────────────────────────────────────────
  var levelMap  = {};
  T.levels.forEach(function (l) { levelMap[l.id] = l; });
  var levelLabel = (levelMap[level] && levelMap[level].label) || level;

  // ── Set nav content ──────────────────────────────────────────────
  document.title = node.label + ' – Lernpfad Mathematik';
  stepEl.textContent = 'Schritt ' + (idx + 1) + ' / ' + total + ' · ' + levelLabel;
  labelEl.textContent = node.label;
  progFill.style.width = ((idx + 1) / total * 100) + '%';

  prevBtn.disabled = idx === 0;

  var isLast = idx === total - 1;
  if (isLast) {
    nextBtn.textContent = 'Fertig — Übersicht';
    nextBtn.classList.add('nav-finish');
  }

  // ── Navigation ───────────────────────────────────────────────────
  prevBtn.addEventListener('click', function () {
    if (idx > 0) {
      localStorage.setItem('mathe_path', JSON.stringify({ level: level, idx: idx - 1 }));
      location.href = 'guided-viewer.html?level=' + level + '&idx=' + (idx - 1);
    }
  });

  nextBtn.addEventListener('click', function () {
    if (isLast) {
      location.href = 'index.html?level=' + level;
    } else {
      localStorage.setItem('mathe_path', JSON.stringify({ level: level, idx: idx + 1 }));
      location.href = 'guided-viewer.html?level=' + level + '&idx=' + (idx + 1);
    }
  });

  exitBtn.addEventListener('click', function () {
    location.href = 'index.html';
  });

  hintClose.addEventListener('click', function () {
    fapHint.hidden = true;
    frame.style.top = getFrameTop(false);
  });

  // ── iframe positioning ───────────────────────────────────────────
  var NAV_H = 54;
  var HINT_H = 36;

  function getFrameTop(hintVisible) {
    return (hintVisible ? NAV_H + HINT_H : NAV_H) + 'px';
  }

  frame.style.top = getFrameTop(false);

  // ── Load exercise in iframe ───────────────────────────────────────
  frame.src = node.exercise.url;

  frame.addEventListener('load', function () {
    // Chapter deep-link: jump to specific tab via switchTab() if available
    if (node.exercise.chapter) {
      try {
        var fn = frame.contentWindow && frame.contentWindow.switchTab;
        if (typeof fn === 'function') fn(node.exercise.chapter);
      } catch (e) { /* cross-origin guard (should never trigger — same origin) */ }
    }

    // FAP filter hint
    if (node.exercise.isFap && node.exercise.filter) {
      var f = node.exercise.filter;
      fapText.textContent = node.label + ' — Filter: ' + f.typen.join(', ') + ' (' + f.fach + ')';
      fapHint.hidden = false;
      frame.style.top = getFrameTop(true);
    }

    // Propagate current theme to iframe
    try {
      var iframeDoc = frame.contentDocument || frame.contentWindow.document;
      if (iframeDoc) {
        var theme = document.documentElement.getAttribute('data-theme');
        iframeDoc.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  });

  // ── Theme toggle ─────────────────────────────────────────────────
  (function () {
    var r = document.documentElement;
    var b = document.getElementById('themeToggle');
    if (!b) {
      // Create the toggle button (not in the nav, fixed position from theme.css)
      b = document.createElement('button');
      b.id = 'themeToggle';
      b.setAttribute('aria-label', 'Farbschema wechseln');
      b.setAttribute('title', 'Farbschema wechseln');
      document.body.appendChild(b);
    }
    function setTheme(t) {
      r.setAttribute('data-theme', t);
      b.textContent = t === 'dark' ? '☾' : '☀';
      // Propagate to already-loaded iframe
      try {
        var iframeDoc = frame.contentDocument || frame.contentWindow.document;
        if (iframeDoc) iframeDoc.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    }
    setTheme(r.getAttribute('data-theme') || 'light');
    b.addEventListener('click', function () {
      var n = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', n);
      setTheme(n);
    });
  })();

})();
</script>
</body>
</html>
