<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$de$endif$" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$title$</title>
<link rel="stylesheet" href="file://$fontdir$/katex/katex.min.css">
<script defer src="file://$fontdir$/katex/katex.min.js"></script>
<script defer src="file://$fontdir$/katex/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[
    {left:'\\\\[',right:'\\\\]',display:true},
    {left:'\\\\(',right:'\\\\)',display:false}
  ],throwOnError:false})"></script>
<style>
$if(fontdir)$
@font-face{font-family:'DM Mono';font-weight:400;src:url('file://$fontdir$/DMMono-400.woff2') format('woff2')}
@font-face{font-family:'DM Mono';font-weight:500;src:url('file://$fontdir$/DMMono-500.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:300;src:url('file://$fontdir$/DMSans-300.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;src:url('file://$fontdir$/DMSans-400.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;src:url('file://$fontdir$/DMSans-500.woff2') format('woff2')}
@font-face{font-family:'DM Serif Display';font-weight:400;src:url('file://$fontdir$/DMSerifDisplay-400.woff2') format('woff2')}
$endif$

:root {
  --ink:    #1a1208;
  --paper:  #f7f3ec;
  --cream:  #ede8de;
  --accent: #c8400a;
  --accent2:#2a6496;
  --gold:   #c9961a;
  --green:  #2e7d4f;
  --line:   #d4cfc6;
  --serif:  'DM Serif Display', Georgia, serif;
  --mono:   'DM Mono', 'Courier New', monospace;
  --sans:   'DM Sans', Helvetica, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  font-size: 11pt;
  line-height: 1.7;
}

/* ── Header ── */
header {
  background: var(--ink);
  color: var(--paper);
  padding: 2rem 2rem 1.5rem;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  top: -60px; right: -80px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: var(--accent);
  opacity: .1;
}
.hinner { max-width: 820px; margin: 0 auto; position: relative; }
.klass {
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .2em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: .4rem;
}
header h1 {
  font-family: var(--serif);
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: .4rem;
}
header p { font-size: .9rem; color: #a09888; }

/* ── Main ── */
main { max-width: 820px; margin: 0 auto; padding: 1.8rem 1.5rem 4rem; }

/* ── Sections (--section-divs) = Aufgaben-Karten ── */
section.level2 {
  background: white;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 1.2rem 1.5rem;
  margin-bottom: 1.4rem;
  box-shadow: 0 2px 6px rgba(0,0,0,.04);
}
section.level2 > h2 {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-weight: 700;
  padding-bottom: .45rem;
  border-bottom: 2px solid var(--accent);
  margin-bottom: .9rem;
  color: var(--ink);
}
section.level3 { margin: .8rem 0; }
section.level3 > h3 {
  font-family: var(--mono);
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent2);
  margin-bottom: .4rem;
}

/* ── Blockquote = Merksatz / Hinweis ── */
blockquote {
  background: var(--cream);
  border-left: 3px solid var(--accent2);
  padding: .8rem 1.2rem;
  margin: .8rem 0;
  border-radius: 0 2px 2px 0;
  font-size: .93rem;
}
blockquote p:last-child { margin-bottom: 0; }

/* ── Fenced div helpers ── */
.problem-box {
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  padding: 1.2rem 1.5rem;
  margin-bottom: 1.8rem;
  position: relative;
  overflow: hidden;
}
.problem-box::before {
  content: '';
  position: absolute;
  right: -40px; top: -40px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: var(--accent);
  opacity: .12;
}
.problem-box p { color: #c8c0b4; font-size: .93rem; }
.problem-box strong, .problem-box em { color: var(--paper); }

.merksatz {
  background: var(--cream);
  border-left: 3px solid var(--accent);
  padding: .85rem 1.2rem;
  margin: .9rem 0;
  border-radius: 0 2px 2px 0;
}
.merksatz p:last-child { margin-bottom: 0; }

.hinweis {
  background: #edf4fb;
  border-left: 3px solid var(--accent2);
  padding: .85rem 1.2rem;
  margin: .9rem 0;
  border-radius: 0 2px 2px 0;
}
.hinweis p:last-child { margin-bottom: 0; }

.fazit {
  background: #eaf7ee;
  border-left: 3px solid var(--green);
  padding: .85rem 1.2rem;
  margin: .9rem 0;
  border-radius: 0 2px 2px 0;
}
.fazit p:last-child { margin-bottom: 0; }

/* ── Schreibbereich ── */
.leer {
  display: inline-block;
  border-bottom: 1px solid #999;
  min-width: 5cm;
  vertical-align: bottom;
}
.schreibbox {
  border: 1px solid var(--line);
  border-radius: 2px;
  min-height: 3cm;
  margin: .5rem 0;
  background: white;
}

/* ── Paragraphs & Lists ── */
p { margin-bottom: .6rem; }
section.level2 > p:last-child,
section.level3 > p:last-child { margin-bottom: 0; }
ul, ol { padding-left: 1.3rem; margin: .5rem 0 .5rem; line-height: 2; }
li { margin-bottom: .1rem; }

/* ── Tables ── */
table { width: 100%; border-collapse: collapse; margin: .9rem 0; font-size: .88rem; }
thead th {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--gold);
  padding: .5rem .8rem;
  text-align: left;
}
tbody td { padding: .55rem .8rem; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: .85rem; }
tbody tr:nth-child(even) td { background: var(--cream); }

/* ── Code / Mono ── */
code { font-family: var(--mono); font-size: .87em; background: var(--cream); padding: .1em .35em; border-radius: 2px; }
pre { background: var(--cream); padding: .9rem 1.2rem; border-radius: 2px; overflow-x: auto; margin: .7rem 0; }
pre code { background: none; padding: 0; font-size: .87em; }

/* ── HR ── */
hr { border: none; border-top: 1px solid var(--line); margin: 1.5rem 0; }

/* ── Zusatzaufgabe ── */
.zusatz {
  border-top: 1px solid var(--line);
  padding-top: 1rem;
  margin-top: 1rem;
  font-size: .93rem;
}

/* ── Print-Header (Name/Datum/Klasse) — nur im Druck sichtbar ── */
.print-header {
  display: none;
  gap: 2rem;
  padding: 1rem 2rem 0;
  font-family: var(--mono);
  font-size: .82rem;
  max-width: 820px;
  margin: 0 auto;
}
.print-header span {
  border-bottom: 1px solid #999;
  min-width: 5cm;
  display: inline-block;
}

/* ══ PRINT ══ */
@media print {
  @page { size: A4; margin: 1.8cm 2cm 2cm 2cm; }
  header { display: none !important; }
  body { background: white; font-size: 10pt; line-height: 1.55; }
  main { padding: 0; max-width: 100%; }
  .print-header { display: flex !important; padding: 0 0 1.2rem; }
  section.level2 {
    box-shadow: none;
    padding: .8rem 1rem;
    margin-bottom: 1rem;
    break-inside: avoid;
  }
  .problem-box, .merksatz, .hinweis, .fazit, blockquote,
  thead th, tbody tr:nth-child(even) td {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>
</head>
<body>

<header>
  <div class="hinner">
    $if(subject)$
    <div class="klass">$subject$$if(grade)$ · $grade$$endif$$if(topic)$ · $topic$$endif$</div>
    $endif$
    <h1>$title$</h1>
    $if(subtitle)$<p>$subtitle$</p>$endif$
  </div>
</header>

<div class="print-header">
  <div>Name:&nbsp;<span>&nbsp;</span></div>
  <div>Datum:&nbsp;<span style="min-width:3cm">&nbsp;</span></div>
  <div>Klasse:&nbsp;<span style="min-width:2cm">&nbsp;</span></div>
</div>

<main>
$body$
</main>

</body>
</html>
